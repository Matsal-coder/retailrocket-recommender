name: retailrocket-recommender

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: retailrocket-recommender:runtime
    container_name: retailrocket-mlflow
    user: root
    command:
      - /opt/venv/bin/mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/version', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: pipeline
    image: retailrocket-recommender:pipeline
    working_dir: /app
    env_file:
      - .env
    environment:
      APP_ENV: dev
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: retailrocket-recommender
    volumes:
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy
    command:
      - /opt/venv/bin/dvc
      - --version

volumes:
  mlflow_data:
    name: retailrocket_mlflow_data
