data:
  minimum_interactions: 10000
  minimum_users: 100
  minimum_items: 100

preprocessing:
  strategy: implicit_feedback
  allowed_event_types:
    - view
    - addtocart
    - transaction
  event_weights:
    view: 1.0
    addtocart: 3.0
    transaction: 5.0

interaction_filtering:
  minimum_user_interactions: 2
  minimum_item_interactions: 2

split:
  strategy: temporal
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  filter_unknown_entities: true

training:
  random_seed: 1729
  negative_samples_per_positive: 4
  batch_size: 1024
  learning_rate: 0.001
  epochs: 30
  patience: 5
  minimum_delta: 0.0
  weight_decay: 0.0
  device: auto

model:
  name: neural_cf
  embedding_dim: 32
  hidden_layers:
    - 64
    - 32
  dropout: 0.2
