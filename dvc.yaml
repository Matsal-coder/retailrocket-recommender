stages:
  validate_data:
    cmd: poetry run python -m retail_recommender.pipelines.validate_data
    deps:
    - configs/data.yaml
    - data/raw/events.csv
    - src/retail_recommender/data/loaders/retailrocket_loader.py
    - src/retail_recommender/data/validators/events_validator.py
    - src/retail_recommender/pipelines/validate_data.py
    params:
    - data.minimum_interactions
    - data.minimum_items
    - data.minimum_users
    outs:
    - artifacts/reports/data_validation.json
  preprocess:
    cmd: poetry run python -m retail_recommender.pipelines.preprocess
    deps:
    - artifacts/reports/data_validation.json
    - configs/data.yaml
    - data/raw/events.csv
    - src/retail_recommender/data/loaders/retailrocket_loader.py
    - src/retail_recommender/data/preprocessors/base.py
    - src/retail_recommender/data/preprocessors/factory.py
    - src/retail_recommender/data/preprocessors/implicit_feedback.py
    - src/retail_recommender/pipelines/preprocess.py
    params:
    - preprocessing.allowed_event_types
    - preprocessing.event_weights
    - preprocessing.strategy
    outs:
    - data/interim/events_clean.parquet
  feature_engineering:
    cmd: poetry run python -m retail_recommender.pipelines.feature_engineering
    deps:
    - configs/data.yaml
    - data/interim/events_clean.parquet
    - src/retail_recommender/features/id_encoder.py
    - src/retail_recommender/features/interaction_builder.py
    - src/retail_recommender/features/negative_sampling.py
    - src/retail_recommender/features/temporal_split.py
    - src/retail_recommender/pipelines/feature_engineering.py
    params:
    - interaction_filtering.minimum_item_interactions
    - interaction_filtering.minimum_user_interactions
    - split.filter_unknown_entities
    - split.strategy
    - split.test_size
    - split.train_size
    - split.validation_size
    - training.negative_samples_per_positive
    - training.random_seed
    outs:
    - artifacts/encoders/item_encoder.pkl
    - artifacts/encoders/user_encoder.pkl
    - artifacts/reports/feature_engineering_report.json
    - data/processed/test.parquet
    - data/processed/train.parquet
    - data/processed/validation.parquet
    - data/processed/train_positive.parquet
  train:
    cmd: poetry run python -m retail_recommender.pipelines.train
    deps:
    - configs/model.yaml
    - configs/training.yaml
    - data/processed/train.parquet
    - data/processed/validation.parquet
    - src/retail_recommender/models/neural_cf.py
    - src/retail_recommender/pipelines/train.py
    - src/retail_recommender/tracking/mlflow_tracker.py
    - src/retail_recommender/training/dataset.py
    - src/retail_recommender/training/early_stopping.py
    - src/retail_recommender/training/seed.py
    - src/retail_recommender/training/trainer.py
    params:
    - model.dropout
    - model.embedding_dim
    - model.hidden_layers
    - model.name
    - training.random_seed
    - training.batch_size
    - training.device
    - training.epochs
    - training.learning_rate
    - training.minimum_delta
    - training.patience
    - training.weight_decay
    outs:
    - artifacts/models/best_model.pt
    - artifacts/reports/train_metrics.json
  evaluate:
    cmd: poetry run python -m retail_recommender.pipelines.evaluate
    deps:
    - artifacts/models/best_model.pt
    - artifacts/reports/train_metrics.json
    - configs/evaluation.yaml
    - data/processed/test.parquet
    - data/processed/train_positive.parquet
    - src/retail_recommender/evaluation/evaluator.py
    - src/retail_recommender/evaluation/neural_recommender.py
    - src/retail_recommender/evaluation/ranking_metrics.py
    - src/retail_recommender/evaluation/reports.py
    - src/retail_recommender/models/item_knn.py
    - src/retail_recommender/models/neural_cf.py
    - src/retail_recommender/models/popularity.py
    - src/retail_recommender/pipelines/evaluate.py
    - src/retail_recommender/tracking/mlflow_tracker.py
    - src/retail_recommender/training/seed.py
    params:
    - evaluation.candidate_batch_size
    - evaluation.exclude_seen_items
    - evaluation.k
    - evaluation.maximum_users
    - item_knn.minimum_similarity
    - item_knn.n_neighbors
    - model.dropout
    - model.embedding_dim
    - model.hidden_layers
    - model.name
    - training.random_seed
    outs:
    - artifacts/reports/evaluation
